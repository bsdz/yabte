[project]
name = "yabte"
description = "Yet another backtesting engine"
license = "Attribution-NonCommercial 4.0 International"
version = "0.5.0"
readme = "README.md"
authors = [{ name = "Blair Azzopardi", email = "blairuk@gmail.com" }]
requires-python = '>=3.10,<3.14'
dependencies = [
    'pandas (>=2.2.3,<3.0.0)',
    'scipy (>=1.15.2,<2.0.0)',
    'pandas-stubs (>=2.2.3.250308,<3.0.0.0)',
]

[project.urls]
repository = "https://github.com/bsdz/yabte"
documentation = "https://yabte.readthedocs.io/en/latest/"


[project.optional-dependencies]
dev = [
    "black[jupyter]>=25.1.0,<26.0.0",
    "mypy>=1.15.0,<2.0.0",
    "isort>=6.0.1,<7.0.0",
    "docformatter>=1.7.0,<2.0.0",
    "coverage>=7.8.2,<8.0.0",
    "nox>=2025.5.1,<2026.0.0",
    "pytest>=8.0.0,<9.0.0",
    "setuptools>=69.0.3,<70.0.0",
]
notebooks = [
    "matplotlib>=3.6.2,<4.0.0",
    "plotly>=5.10.0,<6.0.0",
    "ipykernel>=6.20.2,<7.0.0",
    "nbconvert>=7.2.9,<8.0.0",
    "quantlib>=1.34,<2.0.0",
    "pyfolio-reloaded>=0.9.8,<1.0.0",
]
docs = [
    "sphinx>=6.1.3,<7.0.0",
    "sphinx-rtd-theme>=1.2.0rc4,<2.0.0",
    "nbsphinx>=0.9.3,<1.0.0",
    "sphinx-gallery>=0.14.0,<1.0.0",
    "nbsphinx-link>=1.3.0,<2.0.0",
]

[tool.isort]
profile = "black"

[[tool.mypy.overrides]]
module = "plotly.*,scipy.*,matplotlib.*"
ignore_missing_imports = true


[tool.setuptools]
py-modules = ["yabte"]
