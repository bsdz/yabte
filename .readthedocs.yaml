# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

  jobs:
    post_install:
      # the docs don't need the C++ engine; notebooks render from saved outputs
      - YABTE_BUILD_CPP=0 pip install .[docs,notebooks]

sphinx:
  configuration: docs/conf.py
